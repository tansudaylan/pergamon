[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pergamon"
version = "0.1.0"
description = "Population analysis and visualization for exoplanet and time-domain astrophysics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Tansu Daylan", email = "tansu.daylan@gmail.com" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy"
]
dependencies = [
  "astropy",
  "chalcedon",
  "matplotlib",
  "numpy",
  "pandas",
  "pcat",
  "scipy",
  "tdpy @ git+https://github.com/tansudaylan/tdpy.git@35df1703c6b63d6a62f7d44b12cf5928b5d355ed",
  "ephesos"
]

[project.optional-dependencies]
analysis = ["miletos"]
bokeh = ["bokeh>=3.4"]
vetting = ["miletos"]

[tool.setuptools.packages.find]
include = ["pergamon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test*.py", "tests.py"]
